# nixpacks.toml — Railway build configuration
#
# Railway's Python buildpack runs on Debian/Ubuntu, so system packages
# are installed via apt, not nix. This installs LibreOffice before
# pip runs, making it available for DOCX→PDF conversion.
#
# If you want to deploy WITHOUT LibreOffice to reduce build time,
# remove the aptPkgs line. The /api/convert endpoint will still work
# for all conversions except DOCX→PDF (which will return a clear error).

[phases.setup]
aptPkgs = ["libreoffice"]