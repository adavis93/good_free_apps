<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Converter – Good Free Apps</title>
  <meta name="description" content="Convert PDF to Word or text. Convert Word or text to PDF. Free, no account required.">

  <!-- Shared Design System -->
  <link rel="stylesheet" href="../../shared/design-tokens.css">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       HEADER
       ========================================= */
    .app-header {
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--color-background);
      position: sticky;
      top: 1rem;
      margin: 1rem 2rem 0;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      z-index: 100;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-sm);
    }

    .app-header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      background: var(--color-accent);
      color: #fff;
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-base);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* =========================================
       LAYOUT
       ========================================= */
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 3rem 2rem 5rem;
    }

    .page-title {
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-bold);
      letter-spacing: -0.025em;
      margin-bottom: 0.375rem;
    }

    .page-subtitle {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      margin-bottom: 2rem;
    }

    /* =========================================
       CONVERTER CARD
       ========================================= */
    .converter-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      overflow: hidden;
    }

    /* ── Upload zone ── */
    .upload-zone {
      padding: 2.75rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      cursor: pointer;
      transition: background var(--transition-normal);
      position: relative;
      min-height: 220px;
    }

    .upload-zone:hover,
    .upload-zone.drag-over {
      background: var(--color-surface-elevated);
    }

    .upload-zone.drag-over {
      outline: 2px dashed var(--color-accent);
      outline-offset: -2px;
    }

    #file-input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon {
      width: 56px;
      height: 56px;
      background: var(--color-surface-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      transition: all var(--transition-normal);
    }

    .upload-zone:hover .upload-icon,
    .upload-zone.drag-over .upload-icon {
      background: var(--color-accent-subtle);
      border-color: var(--color-accent);
    }

    .upload-label {
      text-align: center;
    }

    .upload-label strong {
      display: block;
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-semibold);
      margin-bottom: 0.25rem;
      color: var(--color-text-primary);
    }

    .upload-label span {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
    }

    .upload-formats {
      display: flex;
      gap: 0.5rem;
    }

    .upload-format {
      padding: 0.25rem 0.625rem;
      background: var(--color-background);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      font-family: var(--font-mono);
      color: var(--color-text-tertiary);
    }

    /* ── Divider ── */
    .card-divider {
      height: 1px;
      background: var(--color-border);
    }

    /* ── File bar ── */
    .file-bar {
      display: none;
      padding: 1rem 1.25rem;
      align-items: center;
      gap: 0.875rem;
    }

    .file-bar.visible { display: flex; }

    .file-type-badge {
      min-width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: var(--font-weight-bold);
      font-family: var(--font-mono);
      letter-spacing: 0.03em;
      flex-shrink: 0;
      padding: 0 0.5rem;
    }

    .file-type-badge.pdf  { background: rgba(220,38,38,0.08);  color: #dc2626; border: 1px solid rgba(220,38,38,0.15); }
    .file-type-badge.docx { background: rgba(37,99,235,0.07);  color: #2563eb; border: 1px solid rgba(37,99,235,0.15); }
    .file-type-badge.txt  { background: rgba(22,163,74,0.07);  color: #16a34a; border: 1px solid rgba(22,163,74,0.15); }

    .file-details { flex: 1; min-width: 0; }

    .file-name {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-size {
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
      font-family: var(--font-mono);
    }

    .btn-remove {
      background: none;
      border: none;
      color: var(--color-text-tertiary);
      cursor: pointer;
      padding: 0.25rem 0.375rem;
      border-radius: var(--radius-sm);
      font-size: 1.1rem;
      line-height: 1;
      transition: all var(--transition-fast);
    }

    .btn-remove:hover {
      color: var(--color-error);
      background: rgba(220,38,38,0.07);
    }

    /* ── Format picker ── */
    .format-picker {
      display: none;
      padding: 1.25rem;
      gap: 0.625rem;
      flex-direction: column;
    }

    .format-picker.visible { display: flex; }

    .format-picker-label {
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .format-options {
      display: flex;
      gap: 0.625rem;
      flex-wrap: wrap;
    }

    .format-option {
      flex: 1;
      min-width: 120px;
      padding: 0.875rem 1rem;
      background: var(--color-background);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.625rem;
      font-family: var(--font-primary);
      transition: all var(--transition-fast);
      text-align: left;
    }

    .format-option:hover {
      border-color: var(--color-accent);
      background: var(--color-accent-subtle);
    }

    .format-option.selected {
      border-color: var(--color-accent);
      background: var(--color-accent-subtle);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    .format-option-icon { font-size: 1.25rem; }

    .format-option-label {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
    }

    .format-option.selected .format-option-label {
      color: var(--color-accent);
      font-weight: var(--font-weight-semibold);
    }

    /* ── Action row ── */
    .action-row {
      display: none;
      padding: 1rem 1.25rem;
    }

    .action-row.visible { display: flex; }

    .btn-convert {
      flex: 1;
      width: 100%;
      padding: 0.875rem;
      background: var(--color-accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-primary);
      font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-base);
      cursor: pointer;
      transition: all var(--transition-normal);
    }

    .btn-convert:hover:not(:disabled) {
      background: var(--color-accent-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .btn-convert:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Processing ── */
    .processing {
      display: none;
      padding: 2.25rem 1.25rem;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .processing.visible { display: flex; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .processing-msg  { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
    .processing-hint { font-size: var(--font-size-xs); color: var(--color-text-tertiary); font-family: var(--font-mono); margin-top: -0.5rem; }

    /* ── Result ── */
    .result {
      display: none;
      padding: 1.25rem;
      align-items: center;
      gap: 1rem;
    }

    .result.visible { display: flex; }

    .result-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(22,163,74,0.1);
      border: 1px solid rgba(22,163,74,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .result-info { flex: 1; min-width: 0; }

    .result-filename {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-filesize {
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
      font-family: var(--font-mono);
    }

    .result-btns { display: flex; gap: 0.5rem; flex-shrink: 0; }

    .btn-download {
      padding: 0.625rem 1.125rem;
      background: var(--color-primary);
      color: var(--color-background);
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-primary);
      font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-sm);
      cursor: pointer;
      transition: opacity var(--transition-fast);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .btn-download:hover { opacity: 0.82; }

    .btn-again {
      padding: 0.625rem 0.875rem;
      background: transparent;
      color: var(--color-text-secondary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-family: var(--font-primary);
      font-size: var(--font-size-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
    }

    .btn-again:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }

    /* ── Error ── */
    .error-bar {
      display: none;
      padding: 0.875rem 1.25rem;
      background: rgba(220,38,38,0.05);
      border-top: 1px solid rgba(220,38,38,0.12);
      gap: 0.625rem;
      align-items: flex-start;
    }

    .error-bar.visible { display: flex; }

    .error-icon { color: var(--color-error); flex-shrink: 0; font-size: 0.875rem; margin-top: 0.1rem; }
    .error-msg  { font-size: var(--font-size-sm); color: var(--color-error); line-height: 1.55; }

    /* =========================================
       RESPONSIVE
       ========================================= */
    @media (max-width: 640px) {
      main { padding: 1.5rem 1rem 4rem; }
      .app-header { margin: 0.75rem 1rem 0; padding: 1rem; }
      .format-options { flex-direction: column; }
      .format-option { min-width: unset; }
      .result { flex-wrap: wrap; }
      .result-btns { width: 100%; }
      .btn-download, .btn-again { flex: 1; justify-content: center; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="app-header-left">
      <a href="../../index.html" class="logo">
        <div class="logo-mark">G</div>
        <span>Good Free Apps</span>
      </a>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="window.location.href='../../index.html'" title="All apps">←</button>
      <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme">◑</button>
    </div>
  </header>

  <main>
    <h1 class="page-title">PDF Converter</h1>
    <p class="page-subtitle">Convert between PDF, Word, and plain text.</p>

    <div class="converter-card">

      <!-- Upload zone -->
      <div class="upload-zone" id="upload-zone">
        <input type="file" id="file-input" accept=".pdf,.docx,.doc,.txt,.md" aria-label="Upload file">
        <div class="upload-icon">📄</div>
        <div class="upload-label">
          <strong>Drop a file here</strong>
          <span>or click to browse</span>
        </div>
        <div class="upload-formats">
          <span class="upload-format">PDF</span>
          <span class="upload-format">DOCX</span>
          <span class="upload-format">TXT</span>
        </div>
      </div>

      <!-- File bar (shown after upload) -->
      <div class="file-bar" id="file-bar">
        <div class="file-type-badge" id="file-type-badge">—</div>
        <div class="file-details">
          <div class="file-name" id="file-name">—</div>
          <div class="file-size" id="file-size">—</div>
        </div>
        <button class="btn-remove" onclick="resetAll()" aria-label="Remove file">×</button>
      </div>

      <div class="card-divider" id="divider-1" style="display:none;"></div>

      <!-- Error -->
      <div class="error-bar" id="error-bar" role="alert">
        <span class="error-icon">⚠</span>
        <span class="error-msg" id="error-msg"></span>
      </div>

      <!-- Format picker -->
      <div class="format-picker" id="format-picker">
        <div class="format-picker-label">Convert to</div>
        <div class="format-options" id="format-options"></div>
      </div>

      <div class="card-divider" id="divider-2" style="display:none;"></div>

      <!-- Convert button -->
      <div class="action-row" id="action-row">
        <button class="btn-convert" id="convert-btn" onclick="runConversion()" disabled>Convert</button>
      </div>

      <!-- Processing state -->
      <div class="processing" id="processing">
        <div class="spinner"></div>
        <div class="processing-msg" id="processing-msg">Converting…</div>
        <div class="processing-hint" id="processing-hint"></div>
      </div>

      <!-- Result -->
      <div class="result" id="result">
        <div class="result-icon">✓</div>
        <div class="result-info">
          <div class="result-filename" id="result-filename">—</div>
          <div class="result-filesize" id="result-filesize">—</div>
        </div>
        <div class="result-btns">
          <button class="btn-download" onclick="downloadResult()">↓ Download</button>
          <button class="btn-again" onclick="resetAll()">Convert another</button>
        </div>
      </div>

    </div>
  </main>

  <script>
    // =============================================
    // CONFIGURATION
    // =============================================
    const BACKEND_URL = 'https://goodfreeapps-production.up.railway.app';

    // =============================================
    // CONVERSION OPTIONS PER SOURCE FORMAT
    // =============================================
    const TARGETS = {
      pdf: [
        { format: 'docx', label: 'Word (.docx)', icon: '📝',
          msg: 'Converting to Word…', hint: 'May take a moment for complex PDFs' },
        { format: 'txt',  label: 'Plain text (.txt)', icon: '📋',
          msg: 'Extracting text…', hint: '' },
      ],
      docx: [
        { format: 'pdf',  label: 'PDF (.pdf)',  icon: '📄',
          msg: 'Rendering PDF…', hint: 'May take 15–30 seconds for large documents' },
        { format: 'txt',  label: 'Plain text (.txt)', icon: '📋',
          msg: 'Extracting text…', hint: '' },
      ],
      txt: [
        { format: 'pdf',  label: 'PDF (.pdf)',  icon: '📄',
          msg: 'Typesetting PDF…', hint: '' },
        { format: 'docx', label: 'Word (.docx)', icon: '📝',
          msg: 'Building Word document…', hint: '' },
      ],
    };

    // =============================================
    // STATE
    // =============================================
    let currentFile    = null;
    let sourceFormat   = null;
    let selectedTarget = null;
    let resultBlob     = null;
    let resultFilename = null;

    // =============================================
    // THEME
    // =============================================
    function toggleTheme() {
      const html = document.documentElement;
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }

    (function() {
      const saved = localStorage.getItem('theme');
      const dark  = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (dark ? 'dark' : 'light'));
    })();

    // =============================================
    // FILE HANDLING
    // =============================================
    const uploadZone = document.getElementById('upload-zone');
    const fileInput  = document.getElementById('file-input');

    uploadZone.addEventListener('dragover', e => {
      e.preventDefault();
      uploadZone.classList.add('drag-over');
    });

    uploadZone.addEventListener('dragleave', e => {
      if (!uploadZone.contains(e.relatedTarget)) uploadZone.classList.remove('drag-over');
    });

    uploadZone.addEventListener('drop', e => {
      e.preventDefault();
      uploadZone.classList.remove('drag-over');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) handleFile(fileInput.files[0]);
    });

    function handleFile(file) {
      clearError();

      const ext = file.name.split('.').pop().toLowerCase();
      const fmtMap = { pdf: 'pdf', docx: 'docx', doc: 'docx', txt: 'txt', md: 'txt', markdown: 'txt' };
      const fmt    = fmtMap[ext];

      if (!fmt) {
        showError(`".${ext}" files are not supported. Upload a PDF, DOCX, or TXT file.`);
        return;
      }
      if (file.size > 50 * 1024 * 1024) {
        showError('File exceeds the 50 MB limit.');
        return;
      }

      currentFile  = file;
      sourceFormat = fmt;

      const badge = document.getElementById('file-type-badge');
      badge.textContent = ext.toUpperCase();
      badge.className = `file-type-badge ${fmt}`;
      document.getElementById('file-name').textContent = file.name;
      document.getElementById('file-size').textContent = fmtSize(file.size);
      document.getElementById('file-bar').classList.add('visible');
      document.getElementById('upload-zone').style.display = 'none';
      document.getElementById('divider-1').style.display   = '';

      renderTargets(fmt);
      document.getElementById('format-picker').classList.add('visible');
      document.getElementById('divider-2').style.display  = '';
      document.getElementById('action-row').classList.add('visible');
    }

    function renderTargets(fmt) {
      const container = document.getElementById('format-options');
      container.innerHTML = '';
      selectedTarget = null;
      document.getElementById('convert-btn').disabled = true;

      (TARGETS[fmt] || []).forEach((t, i) => {
        const btn = document.createElement('button');
        btn.className    = 'format-option';
        btn.dataset.fmt  = t.format;
        btn.innerHTML    = `
          <span class="format-option-icon">${t.icon}</span>
          <span class="format-option-label">${t.label}</span>
        `;
        btn.addEventListener('click', () => selectTarget(t.format));
        container.appendChild(btn);
        if (i === 0) setTimeout(() => selectTarget(t.format), 0);
      });
    }

    function selectTarget(fmt) {
      selectedTarget = fmt;
      document.querySelectorAll('.format-option').forEach(b => {
        b.classList.toggle('selected', b.dataset.fmt === fmt);
      });
      document.getElementById('convert-btn').disabled = false;
    }

    // =============================================
    // CONVERSION
    // =============================================
    async function runConversion() {
      if (!currentFile || !selectedTarget || !BACKEND_URL) return;

      clearError();
      resultBlob = null;
      document.getElementById('result').classList.remove('visible');
      document.getElementById('format-picker').classList.remove('visible');
      document.getElementById('divider-2').style.display  = 'none';
      document.getElementById('action-row').classList.remove('visible');
      document.getElementById('processing').classList.add('visible');

      const tInfo = (TARGETS[sourceFormat] || []).find(t => t.format === selectedTarget);
      document.getElementById('processing-msg').textContent  = tInfo?.msg  || 'Converting…';
      document.getElementById('processing-hint').textContent = tInfo?.hint || '';

      try {
        const fd = new FormData();
        fd.append('file', currentFile);
        fd.append('target_format', selectedTarget);

        const ctrl = new AbortController();
        const tid  = setTimeout(() => ctrl.abort(), 3 * 60 * 1000);

        const res = await fetch(`${BACKEND_URL}/api/convert`, {
          method: 'POST',
          body: fd,
          signal: ctrl.signal,
        });

        clearTimeout(tid);

        if (!res.ok) {
          let msg = 'Conversion failed. Please try again.';
          try {
            const err = await res.json();
            msg = mapError(err.code, err.message);
          } catch (_) {}
          showError(msg);
          restoreControls();
          return;
        }

        const blob = await res.blob();
        const stem = currentFile.name.replace(/\.[^.]+$/, '');
        const exts  = { txt: '.txt', docx: '.docx', pdf: '.pdf' };
        resultFilename = stem + (exts[selectedTarget] || `.${selectedTarget}`);
        resultBlob     = blob;

        document.getElementById('result-filename').textContent = resultFilename;
        document.getElementById('result-filesize').textContent = fmtSize(blob.size);
        document.getElementById('result').classList.add('visible');

      } catch (err) {
        if (err.name === 'AbortError') {
          showError('The request timed out. Try a smaller file or try again later.');
        } else if (err.name === 'TypeError') {
          showError('Could not reach the server. Check your connection and try again.');
        } else {
          showError('Something went wrong. Please try again.');
          console.error('[PDF Converter]', err);
        }
        restoreControls();
      } finally {
        document.getElementById('processing').classList.remove('visible');
      }
    }

    function downloadResult() {
      if (!resultBlob || !resultFilename) return;
      const url = URL.createObjectURL(resultBlob);
      const a   = document.createElement('a');
      a.href = url; a.download = resultFilename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    function restoreControls() {
      document.getElementById('format-picker').classList.add('visible');
      document.getElementById('divider-2').style.display = '';
      document.getElementById('action-row').classList.add('visible');
    }

    function resetAll() {
      currentFile = sourceFormat = selectedTarget = resultBlob = resultFilename = null;
      fileInput.value = '';
      document.getElementById('upload-zone').style.display    = '';
      document.getElementById('file-bar').classList.remove('visible');
      document.getElementById('divider-1').style.display      = 'none';
      document.getElementById('format-picker').classList.remove('visible');
      document.getElementById('divider-2').style.display      = 'none';
      document.getElementById('action-row').classList.remove('visible');
      document.getElementById('processing').classList.remove('visible');
      document.getElementById('result').classList.remove('visible');
      document.getElementById('convert-btn').disabled = true;
      clearError();
    }

    // =============================================
    // ERRORS
    // =============================================
    function showError(msg) {
      document.getElementById('error-msg').textContent = msg;
      document.getElementById('error-bar').classList.add('visible');
    }

    function clearError() {
      document.getElementById('error-bar').classList.remove('visible');
    }

    function mapError(code, fallback) {
      const map = {
        SCANNED_PDF:            'This PDF is a scanned image — text cannot be extracted without OCR. Try a PDF created digitally.',
        NO_TEXT_EXTRACTED:      'No text could be extracted. The file may be empty or image-only.',
        LIBREOFFICE_ERROR:      'Could not convert to PDF. The file may be password-protected or corrupted.',
        NO_OUTPUT:              'Conversion produced no output. The document may be empty or protected.',
        DEPENDENCY_MISSING:     'A required component is unavailable on the server right now. Please try again later.',
        SAME_FORMAT:            'Source and target formats are the same.',
        UNSUPPORTED_CONVERSION: 'This conversion is not supported.',
        RATE_LIMITED:           'Too many requests — please wait a moment and try again.',
        SIZE_LIMIT_EXCEEDED:    'File exceeds the 50 MB limit.',
        SERVER_ERROR:           'A server error occurred. Please try again.',
      };
      return map[code] || fallback || 'Conversion failed. Please try again.';
    }

    // =============================================
    // UTILITIES
    // =============================================
    function fmtSize(bytes) {
      if (!bytes) return '0 B';
      const u = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return (bytes / Math.pow(1024, i)).toFixed(1) + '\u00a0' + u[i];
    }
  </script>
</body>
</html>
