<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Resizer — Good Free Apps</title>
  <meta name="description" content="Resize images in your browser. No uploads, no accounts, no tracking. Just drag, resize, and download.">

  <!-- Shared Design System -->
  <link rel="stylesheet" href="../../shared/design-tokens.css">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       APP HEADER (consistent across all apps)
       ========================================= */
    .app-header {
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--color-background);
      position: sticky;
      top: 1rem;
      margin: 1rem 2rem 0;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      z-index: 100;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-sm);
    }

    .app-header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      background: var(--color-accent);
      color: #ffffff;
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-base);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* =========================================
       APP LAYOUT
       ========================================= */
    .app-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 2rem 4rem;
    }

    .app-title-section {
      margin-bottom: 2rem;
    }

    .app-title {
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-bold);
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .app-description {
      color: var(--color-text-secondary);
      font-size: var(--font-size-md);
    }

    /* =========================================
       DROPZONE
       ========================================= */
    .dropzone {
      border: 2px dashed var(--color-border-strong);
      border-radius: var(--radius-xl);
      padding: 3.5rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-normal);
      background: var(--color-surface);
      position: relative;
    }

    .dropzone:hover,
    .dropzone.dragover {
      border-color: var(--color-accent);
      background: var(--color-accent-subtle);
    }

    .dropzone.dragover {
      transform: scale(1.01);
    }

    .dropzone-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: block;
      opacity: 0.7;
    }

    .dropzone-title {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-semibold);
      margin-bottom: 0.5rem;
    }

    .dropzone-subtitle {
      color: var(--color-text-tertiary);
      font-size: var(--font-size-sm);
      margin-bottom: 1.25rem;
    }

    .dropzone-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: var(--color-accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-primary);
      font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-sm);
      cursor: pointer;
      transition: all var(--transition-normal);
    }

    .dropzone-btn:hover {
      background: var(--color-accent-hover);
      transform: translateY(-1px);
    }

    .dropzone-formats {
      margin-top: 1.25rem;
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
      font-family: var(--font-mono);
    }

    .file-input {
      display: none;
    }

    /* =========================================
       WORKSPACE (shown after image load)
       ========================================= */
    .workspace {
      display: none;
    }

    .workspace.active {
      display: block;
    }

    /* --- Original Info Bar --- */
    .info-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 1rem 1.5rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      margin-bottom: 1.5rem;
    }

    .info-bar-left {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .info-label {
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: var(--font-weight-semibold);
    }

    .info-value {
      font-family: var(--font-mono);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
    }

    .btn-change-image {
      padding: 0.5rem 1rem;
      background: transparent;
      color: var(--color-text-secondary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-family: var(--font-primary);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      cursor: pointer;
      transition: all var(--transition-normal);
    }

    .btn-change-image:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }

    /* --- Main Grid --- */
    .workspace-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 1.5rem;
      align-items: start;
    }

    /* --- Preview Panel --- */
    .preview-panel {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--color-border);
    }

    .preview-title {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
    }

    .preview-dimensions {
      font-family: var(--font-mono);
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
    }

    .preview-area {
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      max-height: 520px;
      background:
        linear-gradient(45deg, var(--color-surface-elevated) 25%, transparent 25%),
        linear-gradient(-45deg, var(--color-surface-elevated) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--color-surface-elevated) 75%),
        linear-gradient(-45deg, transparent 75%, var(--color-surface-elevated) 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }

    .preview-area img {
      max-width: 100%;
      max-height: 480px;
      object-fit: contain;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-sm);
    }

    .preview-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.875rem 1.25rem;
      border-top: 1px solid var(--color-border);
      background: var(--color-surface);
    }

    .output-size {
      font-family: var(--font-mono);
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
    }

    .output-size-label {
      color: var(--color-text-tertiary);
    }

    /* --- Controls Panel --- */
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .control-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
    }

    .control-card-title {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* --- Presets --- */
    .presets-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .preset-btn {
      padding: 0.625rem 0.75rem;
      background: var(--color-surface-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-family: var(--font-primary);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
      cursor: pointer;
      transition: all var(--transition-normal);
      text-align: left;
      line-height: 1.3;
    }

    .preset-btn:hover {
      border-color: var(--color-accent);
      background: var(--color-accent-subtle);
      color: var(--color-accent);
    }

    .preset-btn.active {
      border-color: var(--color-accent);
      background: var(--color-accent-subtle);
      color: var(--color-accent);
    }

    .preset-name {
      display: block;
      margin-bottom: 0.125rem;
    }

    .preset-size {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      color: var(--color-text-tertiary);
    }

    .preset-btn.active .preset-size,
    .preset-btn:hover .preset-size {
      color: var(--color-accent);
      opacity: 0.7;
    }

    /* --- Dimensions Input --- */
    .dimensions-row {
      display: flex;
      align-items: center;
      gap: 0.625rem;
    }

    .dim-input-group {
      flex: 1;
    }

    .dim-label {
      display: block;
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
      margin-bottom: 0.375rem;
      font-weight: var(--font-weight-medium);
    }

    .dim-input {
      width: 100%;
      padding: 0.75rem 0.875rem;
      border: 1px solid var(--color-border);
      background: var(--color-surface-elevated);
      color: var(--color-text-primary);
      font-family: var(--font-mono);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      border-radius: var(--radius-md);
      transition: all var(--transition-normal);
      text-align: center;
    }

    .dim-input:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px var(--color-accent-subtle);
      background: var(--color-background);
    }

    /* Remove number input spinners */
    .dim-input::-webkit-outer-spin-button,
    .dim-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .dim-input[type=number] {
      -moz-appearance: textfield;
    }

    .lock-btn {
      width: 40px;
      height: 40px;
      background: var(--color-accent-subtle);
      border: 1px solid var(--color-accent);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-normal);
      font-size: 1.125rem;
      color: var(--color-accent);
      margin-top: 1.25rem;
      flex-shrink: 0;
    }

    .lock-btn:hover {
      background: var(--color-accent);
      color: #ffffff;
    }

    .lock-btn.unlocked {
      background: var(--color-surface-elevated);
      border-color: var(--color-border);
      color: var(--color-text-tertiary);
    }

    .lock-btn.unlocked:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }

    .scale-info {
      margin-top: 0.75rem;
      font-family: var(--font-mono);
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
      text-align: center;
    }

    .scale-info .scale-pct {
      color: var(--color-accent);
      font-weight: var(--font-weight-semibold);
    }

    /* --- Format Selector --- */
    .format-row {
      display: flex;
      gap: 0.5rem;
    }

    .format-btn {
      flex: 1;
      padding: 0.625rem;
      background: var(--color-surface-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-family: var(--font-mono);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all var(--transition-normal);
      text-align: center;
      text-transform: uppercase;
    }

    .format-btn:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }

    .format-btn.active {
      border-color: var(--color-accent);
      background: var(--color-accent-subtle);
      color: var(--color-accent);
    }

    .quality-row {
      margin-top: 0.875rem;
      display: none;
    }

    .quality-row.visible {
      display: block;
    }

    .quality-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.375rem;
    }

    .quality-label {
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
      font-weight: var(--font-weight-medium);
    }

    .quality-value {
      font-family: var(--font-mono);
      font-size: var(--font-size-xs);
      color: var(--color-accent);
      font-weight: var(--font-weight-semibold);
    }

    .quality-slider {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--color-surface-elevated);
      border-radius: var(--radius-full);
      outline: none;
      cursor: pointer;
    }

    .quality-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: var(--color-accent);
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid var(--color-background);
      box-shadow: var(--shadow-sm);
    }

    .quality-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      background: var(--color-accent);
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid var(--color-background);
      box-shadow: var(--shadow-sm);
    }

    /* --- Action Buttons --- */
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }

    .btn-download {
      width: 100%;
      padding: 0.9375rem;
      background: var(--color-accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-primary);
      font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-sm);
      cursor: pointer;
      transition: all var(--transition-normal);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-download:hover {
      background: var(--color-accent-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .btn-copy {
      width: 100%;
      padding: 0.9375rem;
      background: transparent;
      color: var(--color-text-primary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-family: var(--font-primary);
      font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-sm);
      cursor: pointer;
      transition: all var(--transition-normal);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-copy:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
      background: var(--color-accent-subtle);
    }

    .btn-copy.copied {
      border-color: var(--color-success);
      color: var(--color-success);
      background: rgba(22, 163, 74, 0.08);
    }

    /* --- Toast --- */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--color-primary);
      color: var(--color-background);
      padding: 0.875rem 1.5rem;
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      box-shadow: var(--shadow-lg);
      z-index: 1000;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    .toast.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* =========================================
       RESPONSIVE
       ========================================= */
    @media (max-width: 900px) {
      .workspace-grid {
        grid-template-columns: 1fr;
      }

      .app-container {
        padding: 1.5rem 1rem 3rem;
      }

      .app-header {
        margin: 0.75rem 1rem 0;
        padding: 1rem 1.25rem;
      }

      .info-bar {
        flex-direction: column;
        align-items: flex-start;
      }

      .info-bar-left {
        width: 100%;
      }

      .btn-change-image {
        width: 100%;
        text-align: center;
      }
    }

    @media (max-width: 600px) {
      .dropzone {
        padding: 2.5rem 1.25rem;
      }

      .presets-grid {
        grid-template-columns: 1fr;
      }

      .app-title {
        font-size: var(--font-size-xl);
      }

      .preview-area {
        min-height: 200px;
      }

      .info-bar-left {
        flex-direction: column;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="app-header-left">
      <a href="../../index.html" class="logo" title="Back to hub">
        <div class="logo-mark">G</div>
        <span>Good Free Apps</span>
      </a>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="window.location.href='../../index.html'" title="Back to all apps">
        ←
      </button>
      <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme">
        <span id="theme-icon">◐</span>
      </button>
    </div>
  </header>

  <!-- App Content -->
  <main class="app-container">
    <div class="app-title-section">
      <h1 class="app-title">Image Resizer</h1>
      <p class="app-description">Resize images in your browser. Nothing leaves your device.</p>
    </div>

    <!-- Dropzone (shown until image is loaded) -->
    <div class="dropzone" id="dropzone">
      <span class="dropzone-icon">🖼️</span>
      <div class="dropzone-title">Drop an image here</div>
      <div class="dropzone-subtitle">or click to browse your files</div>
      <button class="dropzone-btn" id="browse-btn" type="button">Choose Image</button>
      <div class="dropzone-formats">JPEG · PNG · GIF · WebP · BMP · TIFF</div>
      <input
        type="file"
        class="file-input"
        id="file-input"
        accept="image/jpeg,image/png,image/gif,image/webp,image/bmp,image/tiff"
      >
    </div>

    <!-- Workspace (shown after image load) -->
    <div class="workspace" id="workspace">

      <!-- Original Image Info -->
      <div class="info-bar">
        <div class="info-bar-left">
          <div class="info-item">
            <span class="info-label">File</span>
            <span class="info-value" id="info-filename">—</span>
          </div>
          <div class="info-item">
            <span class="info-label">Size</span>
            <span class="info-value" id="info-filesize">—</span>
          </div>
          <div class="info-item">
            <span class="info-label">Original</span>
            <span class="info-value" id="info-dimensions">—</span>
          </div>
        </div>
        <button class="btn-change-image" id="change-image-btn" type="button">Change Image</button>
      </div>

      <!-- Main Grid: Preview + Controls -->
      <div class="workspace-grid">

        <!-- Preview Panel -->
        <div class="preview-panel">
          <div class="preview-header">
            <span class="preview-title">Preview</span>
            <span class="preview-dimensions" id="preview-dimensions">—</span>
          </div>
          <div class="preview-area">
            <img id="preview-image" alt="Resized preview">
          </div>
          <div class="preview-footer">
            <span class="output-size">
              <span class="output-size-label">Est. size: </span>
              <span id="output-filesize">—</span>
            </span>
          </div>
        </div>

        <!-- Controls -->
        <div class="controls-panel">

          <!-- Presets -->
          <div class="control-card">
            <div class="control-card-title">📐 Presets</div>
            <div class="presets-grid" id="presets-grid">
              <!-- Rendered by JS -->
            </div>
          </div>

          <!-- Dimensions -->
          <div class="control-card">
            <div class="control-card-title">📏 Dimensions</div>
            <div class="dimensions-row">
              <div class="dim-input-group">
                <label class="dim-label" for="width-input">Width (px)</label>
                <input type="number" class="dim-input" id="width-input" min="1" max="10000" placeholder="Width">
              </div>
              <button class="lock-btn" id="lock-btn" type="button" title="Lock aspect ratio" aria-label="Lock aspect ratio">
                🔗
              </button>
              <div class="dim-input-group">
                <label class="dim-label" for="height-input">Height (px)</label>
                <input type="number" class="dim-input" id="height-input" min="1" max="10000" placeholder="Height">
              </div>
            </div>
            <div class="scale-info" id="scale-info"></div>
          </div>

          <!-- Output Format -->
          <div class="control-card">
            <div class="control-card-title">💾 Output Format</div>
            <div class="format-row" id="format-row">
              <!-- Rendered by JS -->
            </div>
            <div class="quality-row" id="quality-row">
              <div class="quality-label-row">
                <span class="quality-label">Quality</span>
                <span class="quality-value" id="quality-value">92%</span>
              </div>
              <input type="range" class="quality-slider" id="quality-slider" min="10" max="100" value="92">
            </div>
          </div>

          <!-- Actions -->
          <div class="action-buttons">
            <button class="btn-download" id="download-btn" type="button">
              <span>⬇</span> Download Resized Image
            </button>
            <button class="btn-copy" id="copy-btn" type="button">
              <span>📋</span> Copy to Clipboard
            </button>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <!-- Hidden canvas for resizing -->
  <canvas id="resize-canvas" style="display:none;"></canvas>

  <script>
    // =========================================
    // APP CONFIGURATION
    // =========================================
    const APP_NAME = 'image-resizer';

    const PRESETS = [
      { name: 'Profile Photo',     w: 200,  h: 200,  },
      { name: 'Favicon',           w: 32,   h: 32,   },
      { name: 'Instagram Square',  w: 1080, h: 1080, },
      { name: 'Passport Photo',    w: 600,  h: 600,  },
      { name: 'Twitter/X Header',  w: 1500, h: 500,  },
      { name: 'Facebook Cover',    w: 820,  h: 312,  },
      { name: 'LinkedIn Banner',   w: 1584, h: 396,  },
    ];

    const FORMATS = [
      { id: 'jpeg', label: 'JPEG', mime: 'image/jpeg',  hasQuality: true  },
      { id: 'png',  label: 'PNG',  mime: 'image/png',   hasQuality: false },
      { id: 'webp', label: 'WebP', mime: 'image/webp',  hasQuality: true  },
    ];

    // =========================================
    // STATE
    // =========================================
    let state = {
      originalImage: null,       // HTMLImageElement
      originalFile: null,        // File object
      originalWidth: 0,
      originalHeight: 0,
      targetWidth: 0,
      targetHeight: 0,
      aspectRatioLocked: true,
      aspectRatio: 1,
      outputFormat: 'jpeg',
      quality: 0.92,
      activePreset: null,
      resizedBlob: null,         // Last rendered blob
    };

    // =========================================
    // DOM REFS
    // =========================================
    const $ = (sel) => document.querySelector(sel);
    const dropzone = $('#dropzone');
    const fileInput = $('#file-input');
    const workspace = $('#workspace');
    const widthInput = $('#width-input');
    const heightInput = $('#height-input');
    const lockBtn = $('#lock-btn');
    const previewImage = $('#preview-image');
    const canvas = $('#resize-canvas');
    const ctx = canvas.getContext('2d');
    const qualitySlider = $('#quality-slider');
    const qualityRow = $('#quality-row');
    const qualityValue = $('#quality-value');
    const downloadBtn = $('#download-btn');
    const copyBtn = $('#copy-btn');
    const toastEl = $('#toast');

    // =========================================
    // THEME
    // =========================================
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }

    function initTheme() {
      const saved = localStorage.getItem('theme');
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (systemDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    }

    // =========================================
    // FILE UPLOAD
    // =========================================
    function setupDropzone() {
      // Click to browse
      dropzone.addEventListener('click', (e) => {
        if (e.target.closest('#browse-btn') || e.target === dropzone || e.target.closest('.dropzone-title') || e.target.closest('.dropzone-subtitle') || e.target.closest('.dropzone-icon')) {
          fileInput.click();
        }
      });

      $('#browse-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        fileInput.click();
      });

      // File selected
      fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          loadImage(e.target.files[0]);
        }
      });

      // Drag and drop
      dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      });

      dropzone.addEventListener('dragleave', () => {
        dropzone.classList.remove('dragover');
      });

      dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
          loadImage(file);
        } else {
          showToast('Please drop an image file');
        }
      });

      // Change image button
      $('#change-image-btn').addEventListener('click', () => {
        fileInput.value = '';
        fileInput.click();
      });
    }

    function loadImage(file) {
      // Validate type
      const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'image/bmp', 'image/tiff'];
      if (!validTypes.includes(file.type)) {
        showToast('Unsupported file format');
        return;
      }

      state.originalFile = file;

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          state.originalImage = img;
          state.originalWidth = img.naturalWidth;
          state.originalHeight = img.naturalHeight;
          state.aspectRatio = img.naturalWidth / img.naturalHeight;

          // Default target = original size
          state.targetWidth = img.naturalWidth;
          state.targetHeight = img.naturalHeight;
          state.activePreset = null;

          showWorkspace();
          populateInfo();
          updateDimensionInputs();
          renderPreview();
        };
        img.onerror = () => {
          showToast('Could not load image');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // =========================================
    // WORKSPACE UI
    // =========================================
    function showWorkspace() {
      dropzone.style.display = 'none';
      workspace.classList.add('active');
    }

    function populateInfo() {
      const f = state.originalFile;
      $('#info-filename').textContent = truncateFilename(f.name, 28);
      $('#info-filesize').textContent = formatFileSize(f.size);
      $('#info-dimensions').textContent = `${state.originalWidth} × ${state.originalHeight}`;
    }

    // =========================================
    // PRESETS
    // =========================================
    function renderPresets() {
      const grid = $('#presets-grid');
      grid.innerHTML = PRESETS.map((p, i) => `
        <button class="preset-btn" data-index="${i}" type="button">
          <span class="preset-name">${p.name}</span>
          <span class="preset-size">${p.w} × ${p.h}</span>
        </button>
      `).join('');

      grid.addEventListener('click', (e) => {
        const btn = e.target.closest('.preset-btn');
        if (!btn) return;
        const idx = parseInt(btn.dataset.index);
        applyPreset(idx);
      });
    }

    function applyPreset(index) {
      const p = PRESETS[index];
      state.targetWidth = p.w;
      state.targetHeight = p.h;
      state.activePreset = index;

      // Temporarily unlock aspect ratio for presets (preset defines both dimensions)
      updateDimensionInputs();
      highlightPreset(index);
      renderPreview();
    }

    function highlightPreset(index) {
      document.querySelectorAll('.preset-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });
    }

    function clearPresetHighlight() {
      state.activePreset = null;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    }

    // =========================================
    // DIMENSIONS
    // =========================================
    function setupDimensionInputs() {
      widthInput.addEventListener('input', () => {
        const w = parseInt(widthInput.value);
        if (!w || w < 1) return;
        state.targetWidth = w;
        if (state.aspectRatioLocked) {
          state.targetHeight = Math.round(w / state.aspectRatio);
          heightInput.value = state.targetHeight;
        }
        clearPresetHighlight();
        updateScaleInfo();
        debouncedRender();
      });

      heightInput.addEventListener('input', () => {
        const h = parseInt(heightInput.value);
        if (!h || h < 1) return;
        state.targetHeight = h;
        if (state.aspectRatioLocked) {
          state.targetWidth = Math.round(h * state.aspectRatio);
          widthInput.value = state.targetWidth;
        }
        clearPresetHighlight();
        updateScaleInfo();
        debouncedRender();
      });

      // Also update on blur for clean values
      widthInput.addEventListener('blur', finalizeWidthInput);
      heightInput.addEventListener('blur', finalizeHeightInput);

      // Enter key triggers finalize
      widthInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { finalizeWidthInput(); widthInput.blur(); } });
      heightInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { finalizeHeightInput(); heightInput.blur(); } });
    }

    function finalizeWidthInput() {
      let w = parseInt(widthInput.value);
      if (!w || w < 1) w = state.originalWidth;
      w = Math.min(w, 10000);
      state.targetWidth = w;
      if (state.aspectRatioLocked) {
        state.targetHeight = Math.round(w / state.aspectRatio);
      }
      updateDimensionInputs();
      renderPreview();
    }

    function finalizeHeightInput() {
      let h = parseInt(heightInput.value);
      if (!h || h < 1) h = state.originalHeight;
      h = Math.min(h, 10000);
      state.targetHeight = h;
      if (state.aspectRatioLocked) {
        state.targetWidth = Math.round(h * state.aspectRatio);
      }
      updateDimensionInputs();
      renderPreview();
    }

    function updateDimensionInputs() {
      widthInput.value = state.targetWidth;
      heightInput.value = state.targetHeight;
      updateScaleInfo();
    }

    function updateScaleInfo() {
      const scaleW = ((state.targetWidth / state.originalWidth) * 100).toFixed(0);
      const scaleH = ((state.targetHeight / state.originalHeight) * 100).toFixed(0);
      const el = $('#scale-info');
      if (scaleW === scaleH) {
        el.innerHTML = `Scale: <span class="scale-pct">${scaleW}%</span>`;
      } else {
        el.innerHTML = `Scale: <span class="scale-pct">${scaleW}%</span> × <span class="scale-pct">${scaleH}%</span>`;
      }
    }

    // =========================================
    // ASPECT RATIO LOCK
    // =========================================
    function setupLockButton() {
      lockBtn.addEventListener('click', () => {
        state.aspectRatioLocked = !state.aspectRatioLocked;
        lockBtn.classList.toggle('unlocked', !state.aspectRatioLocked);
        lockBtn.innerHTML = state.aspectRatioLocked ? '🔗' : '↔️';
        lockBtn.title = state.aspectRatioLocked ? 'Aspect ratio locked — click to unlock' : 'Aspect ratio unlocked — click to lock';

        // If re-locking, recalculate height from current width
        if (state.aspectRatioLocked) {
          state.aspectRatio = state.originalWidth / state.originalHeight;
          state.targetHeight = Math.round(state.targetWidth / state.aspectRatio);
          updateDimensionInputs();
          renderPreview();
        }
      });
    }

    // =========================================
    // OUTPUT FORMAT
    // =========================================
    function renderFormatButtons() {
      const row = $('#format-row');
      row.innerHTML = FORMATS.map(f =>
        `<button class="format-btn ${f.id === state.outputFormat ? 'active' : ''}" data-format="${f.id}" type="button">${f.label}</button>`
      ).join('');

      row.addEventListener('click', (e) => {
        const btn = e.target.closest('.format-btn');
        if (!btn) return;
        state.outputFormat = btn.dataset.format;
        document.querySelectorAll('.format-btn').forEach(b => b.classList.toggle('active', b.dataset.format === state.outputFormat));
        updateQualityVisibility();
        renderPreview();
      });
    }

    function updateQualityVisibility() {
      const fmt = FORMATS.find(f => f.id === state.outputFormat);
      qualityRow.classList.toggle('visible', fmt && fmt.hasQuality);
    }

    function setupQualitySlider() {
      qualitySlider.addEventListener('input', () => {
        state.quality = parseInt(qualitySlider.value) / 100;
        qualityValue.textContent = qualitySlider.value + '%';
        debouncedRender();
      });
    }

    // =========================================
    // RESIZE & RENDER PREVIEW
    // =========================================
    let renderTimeout = null;
    function debouncedRender() {
      clearTimeout(renderTimeout);
      renderTimeout = setTimeout(renderPreview, 150);
    }

    function renderPreview() {
      if (!state.originalImage) return;

      const w = state.targetWidth;
      const h = state.targetHeight;
      if (!w || !h || w < 1 || h < 1) return;

      canvas.width = w;
      canvas.height = h;

      // Use high-quality interpolation
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(state.originalImage, 0, 0, w, h);

      // Get blob for size estimation and download
      const fmt = FORMATS.find(f => f.id === state.outputFormat);
      const mimeType = fmt ? fmt.mime : 'image/jpeg';
      const quality = fmt && fmt.hasQuality ? state.quality : undefined;

      canvas.toBlob((blob) => {
        if (!blob) return;
        state.resizedBlob = blob;

        // Update preview image
        const url = URL.createObjectURL(blob);
        previewImage.onload = () => URL.revokeObjectURL(url);
        previewImage.src = url;

        // Update output info
        $('#output-filesize').textContent = formatFileSize(blob.size);
        $('#preview-dimensions').textContent = `${w} × ${h}`;
      }, mimeType, quality);
    }

    // =========================================
    // DOWNLOAD
    // =========================================
    function setupDownload() {
      downloadBtn.addEventListener('click', () => {
        if (!state.resizedBlob) {
          showToast('No image to download');
          return;
        }

        const ext = state.outputFormat === 'jpeg' ? 'jpg' : state.outputFormat;
        const baseName = state.originalFile.name.replace(/\.[^/.]+$/, '');
        const filename = `${baseName}_${state.targetWidth}x${state.targetHeight}.${ext}`;

        const url = URL.createObjectURL(state.resizedBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showToast('Image downloaded');
      });
    }

    // =========================================
    // COPY TO CLIPBOARD
    // =========================================
    function setupCopy() {
      copyBtn.addEventListener('click', async () => {
        if (!state.resizedBlob) {
          showToast('No image to copy');
          return;
        }

        try {
          // ClipboardItem requires PNG for most browsers
          let blobToCopy = state.resizedBlob;
          if (state.resizedBlob.type !== 'image/png') {
            // Re-render as PNG for clipboard
            blobToCopy = await new Promise((resolve) => {
              canvas.toBlob((b) => resolve(b), 'image/png');
            });
          }

          await navigator.clipboard.write([
            new ClipboardItem({ 'image/png': blobToCopy })
          ]);

          copyBtn.classList.add('copied');
          copyBtn.innerHTML = '<span>✓</span> Copied!';
          showToast('Image copied to clipboard');

          setTimeout(() => {
            copyBtn.classList.remove('copied');
            copyBtn.innerHTML = '<span>📋</span> Copy to Clipboard';
          }, 2000);
        } catch (err) {
          console.error('Copy failed:', err);
          showToast('Copy not supported in this browser');
        }
      });
    }

    // =========================================
    // UTILITIES
    // =========================================
    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function truncateFilename(name, maxLen) {
      if (name.length <= maxLen) return name;
      const ext = name.split('.').pop();
      const base = name.substring(0, maxLen - ext.length - 4);
      return base + '….' + ext;
    }

    let toastTimer = null;
    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove('visible');
      }, 2500);
    }

    // =========================================
    // KEYBOARD SHORTCUTS
    // =========================================
    document.addEventListener('keydown', (e) => {
      // Cmd/Ctrl+S to download
      if ((e.metaKey || e.ctrlKey) && e.key === 's') {
        e.preventDefault();
        if (state.resizedBlob) downloadBtn.click();
      }
      // Cmd/Ctrl+C when not in input to copy
      if ((e.metaKey || e.ctrlKey) && e.key === 'c' && document.activeElement.tagName !== 'INPUT') {
        // Only intercept if workspace is active
        if (workspace.classList.contains('active')) {
          // Don't prevent default - let normal copy work if text is selected
          const selection = window.getSelection();
          if (!selection || selection.toString().length === 0) {
            e.preventDefault();
            copyBtn.click();
          }
        }
      }
    });

    // =========================================
    // DRAG-AND-DROP ANYWHERE (when workspace is open)
    // =========================================
    document.addEventListener('dragover', (e) => {
      if (workspace.classList.contains('active')) {
        e.preventDefault();
      }
    });

    document.addEventListener('drop', (e) => {
      if (workspace.classList.contains('active')) {
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
          loadImage(file);
        }
      }
    });

    // =========================================
    // INIT
    // =========================================
    function init() {
      initTheme();
      setupDropzone();
      renderPresets();
      setupDimensionInputs();
      setupLockButton();
      renderFormatButtons();
      updateQualityVisibility();
      setupQualitySlider();
      setupDownload();
      setupCopy();
    }

    init();
  </script>
</body>
</html>
