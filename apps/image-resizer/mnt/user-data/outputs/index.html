<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Free Apps â€” Simple tools for everyday tasks</title>
  <meta name="description" content="Free, simple web applications for everyday tasks. No ads, no accounts, no tracking. Just tools that work.">

  <!-- Design System -->
  <link rel="stylesheet" href="shared/design-tokens.css">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       HUB-SPECIFIC STYLES
       ========================================= */

    /* --- Header --- */
    .header {
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--color-background);
      position: sticky;
      top: 1rem;
      margin: 1rem 2rem 0;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      z-index: 100;
      backdrop-filter: blur(12px);
      transition: all var(--transition-slow);
      box-shadow: var(--shadow-sm);
    }

    .header:hover {
      box-shadow: var(--shadow-md);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
      letter-spacing: -0.02em;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      background: var(--color-accent);
      color: #ffffff;
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-base);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* --- Main Content --- */
    main {
      padding: var(--content-padding) 3.5rem;
      max-width: var(--max-width);
      margin: 0 auto;
    }

    /* --- Hero --- */
    .hero {
      margin-bottom: 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    .hero-content {
      flex: 1;
    }

    .hero-title {
      font-size: var(--font-size-4xl);
      font-weight: var(--font-weight-bold);
      line-height: var(--line-height-tight);
      margin-bottom: 0.75rem;
      letter-spacing: -0.03em;
      color: var(--color-text-primary);
    }

    .hero-subtitle {
      font-size: var(--font-size-md);
      color: var(--color-text-secondary);
      max-width: 500px;
      font-weight: var(--font-weight-normal);
    }

    .search-box {
      flex: 0 0 380px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 1rem 1.25rem;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-primary);
      font-family: var(--font-primary);
      font-size: var(--font-size-sm);
      border-radius: var(--radius-lg);
      transition: all var(--transition-normal);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px var(--color-accent-subtle);
      background: var(--color-background);
    }

    .search-input::placeholder {
      color: var(--color-text-tertiary);
    }

    /* --- App Grid --- */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
    }

    .app-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      transition: all var(--transition-spring);
      cursor: pointer;
      position: relative;
      text-decoration: none;
      color: inherit;
      display: block;
      animation: slideUp 0.5s ease forwards;
      animation-delay: calc(var(--index) * 0.04s);
      opacity: 0;
    }

    @keyframes slideUp {
      from {
        transform: translateY(16px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .app-card:hover {
      border-color: var(--color-accent);
      box-shadow: var(--shadow-md);
      transform: translateY(-4px);
    }

    .app-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .app-icon {
      width: 48px;
      height: 48px;
      background: var(--color-surface-elevated);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      transition: all var(--transition-normal);
    }

    .app-card:hover .app-icon {
      background: var(--color-accent-subtle);
      transform: scale(1.05);
    }

    .bookmark-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.125rem;
      color: var(--color-text-tertiary);
      transition: all var(--transition-normal);
      padding: 0.25rem;
      line-height: 1;
    }

    .bookmark-btn:hover,
    .bookmark-btn.active {
      color: var(--color-accent);
      transform: scale(1.15);
    }

    .app-name {
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-semibold);
      margin-bottom: 0.375rem;
      letter-spacing: -0.01em;
    }

    .app-description {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      line-height: var(--line-height-normal);
    }

    /* --- Empty State --- */
    .empty-state {
      display: none;
      text-align: center;
      padding: 4rem 2rem;
      color: var(--color-text-tertiary);
    }

    .empty-state.visible {
      display: block;
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .empty-state-text {
      font-size: var(--font-size-md);
    }

    /* --- Footer --- */
    footer {
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      padding: 2rem;
      margin-top: 4rem;
    }

    .footer-content {
      max-width: var(--max-width);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .footer-text {
      font-size: var(--font-size-sm);
      color: var(--color-text-tertiary);
    }

    .btn-feedback {
      background: var(--color-accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 0.75rem 1.5rem;
      font-family: var(--font-primary);
      font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-sm);
      cursor: pointer;
      transition: all var(--transition-normal);
    }

    .btn-feedback:hover {
      background: var(--color-accent-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    /* --- Feedback Modal --- */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--color-surface);
      border-radius: var(--radius-xl);
      max-width: 540px;
      width: 100%;
      padding: 2.5rem;
      box-shadow: var(--shadow-lg);
      animation: modalSlideIn 0.3s var(--transition-spring);
      border: 1px solid var(--color-border);
    }

    @keyframes modalSlideIn {
      from {
        transform: translateY(-20px) scale(0.95);
        opacity: 0;
      }
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--color-border);
    }

    .modal-title {
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-bold);
      letter-spacing: -0.01em;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--color-text-tertiary);
      padding: 0.25rem;
      transition: color var(--transition-fast);
    }

    .modal-close:hover {
      color: var(--color-text-primary);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      margin-bottom: 0.5rem;
      color: var(--color-text-primary);
    }

    .star-rating {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.25rem;
    }

    .star-rating button {
      background: none;
      border: none;
      font-size: 1.75rem;
      cursor: pointer;
      color: var(--color-border-strong);
      transition: all var(--transition-fast);
      padding: 0;
      line-height: 1;
    }

    .star-rating button:hover,
    .star-rating button.active {
      color: #f59e0b;
      transform: scale(1.15);
    }

    .anonymous-toggle {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    .anonymous-toggle input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--color-accent);
      cursor: pointer;
    }

    .anonymous-toggle label {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      cursor: pointer;
    }

    .email-field {
      transition: all var(--transition-normal);
      overflow: hidden;
    }

    .email-field.hidden {
      max-height: 0;
      opacity: 0;
      margin: 0;
      padding: 0;
    }

    .email-field.visible {
      max-height: 120px;
      opacity: 1;
    }

    .btn-submit {
      width: 100%;
      padding: 1rem;
      background: var(--color-primary);
      color: var(--color-background);
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-primary);
      font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-base);
      cursor: pointer;
      transition: all var(--transition-normal);
    }

    .btn-submit:hover {
      background: var(--color-primary-hover);
      transform: translateY(-1px);
    }

    /* --- Responsive --- */
    @media (max-width: 1200px) {
      .app-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 900px) {
      .hero {
        flex-direction: column;
        text-align: center;
      }

      .hero-subtitle {
        max-width: 100%;
      }

      .search-box {
        flex: none;
        width: 100%;
        max-width: 500px;
      }

      .app-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      main {
        padding: 2rem 1.5rem;
      }

      .header {
        margin: 0.75rem 1rem 0;
        padding: 1rem 1.25rem;
      }
    }

    @media (max-width: 600px) {
      .app-grid {
        grid-template-columns: 1fr;
      }

      .hero-title {
        font-size: var(--font-size-2xl);
      }

      .footer-content {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <div class="logo-mark">G</div>
      <span>Good Free Apps</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme">
        <span id="theme-icon">â—</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <section class="hero">
      <div class="hero-content">
        <h1 class="hero-title">Simple tools for<br>everyday tasks</h1>
        <p class="hero-subtitle">Free, private, and built to just work. No accounts, no ads, no tracking.</p>
      </div>
      <div class="search-box">
        <input
          type="text"
          class="search-input"
          placeholder="Search apps..."
          id="search-input"
          oninput="filterApps()"
          aria-label="Search applications"
        >
      </div>
    </section>

    <!-- App Grid -->
    <div class="app-grid" id="app-grid">
      <!-- Apps are rendered by JavaScript from the registry below -->
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="empty-state">
      <div class="empty-state-icon">ðŸ”</div>
      <p class="empty-state-text">No apps match your search</p>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <span class="footer-text">Â© 2026 Good Free Apps. Built for everyone.</span>
      <button class="btn-feedback" onclick="openFeedbackModal()">Send Feedback</button>
    </div>
  </footer>

  <!-- Feedback Modal -->
  <div class="modal-overlay" id="feedback-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Send Feedback</h2>
        <button class="modal-close" onclick="closeFeedbackModal()" aria-label="Close">&times;</button>
      </div>

      <div class="form-group">
        <label class="form-label">Rating</label>
        <div class="star-rating" id="star-rating">
          <button onclick="setRating(1)" aria-label="1 star">â˜…</button>
          <button onclick="setRating(2)" aria-label="2 stars">â˜…</button>
          <button onclick="setRating(3)" aria-label="3 stars">â˜…</button>
          <button onclick="setRating(4)" aria-label="4 stars">â˜…</button>
          <button onclick="setRating(5)" aria-label="5 stars">â˜…</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="feedback-category">Category</label>
        <select class="select" id="feedback-category">
          <option value="">Select a category</option>
          <option value="bug">Bug Report</option>
          <option value="feature">Feature Request</option>
          <option value="general">General Feedback</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="feedback-text">Your feedback</label>
        <textarea class="textarea" id="feedback-text" placeholder="Tell us what you think..." rows="4"></textarea>
      </div>

      <div class="form-group">
        <div class="anonymous-toggle">
          <input type="checkbox" id="anonymous-toggle" checked onchange="toggleEmailField()">
          <label for="anonymous-toggle">Submit anonymously</label>
        </div>
      </div>

      <div class="form-group email-field hidden" id="email-field">
        <label class="form-label" for="feedback-email">Email (for follow-up)</label>
        <input class="input" type="email" id="feedback-email" placeholder="your@email.com">
      </div>

      <button class="btn-submit" onclick="submitFeedback()">Submit Feedback</button>
    </div>
  </div>

  <!-- Analytics (shared) -->
  <!-- <script src="shared/analytics.js"></script> -->

  <script>
    // =========================================
    // APP REGISTRY
    // Add new apps here. The grid renders from this array.
    // =========================================
    const apps = [
      {
        id: 'image-resizer',
        name: 'Image Resizer',
        description: 'Resize images in your browser. No uploads, no tracking.',
        icon: '🖼️',
        url: 'apps/image-resizer/index.html'
      },
    ];

    // =========================================
    // THEME MANAGEMENT
    // =========================================
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }

    function initTheme() {
      const saved = localStorage.getItem('theme');
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (systemDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    }

    // =========================================
    // BOOKMARKS
    // =========================================
    function getBookmarks() {
      try {
        return JSON.parse(localStorage.getItem('bookmarks') || '[]');
      } catch {
        return [];
      }
    }

    function toggleBookmark(appId, event) {
      event.preventDefault();
      event.stopPropagation();
      let bookmarks = getBookmarks();
      if (bookmarks.includes(appId)) {
        bookmarks = bookmarks.filter(id => id !== appId);
      } else {
        bookmarks.push(appId);
      }
      localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
      renderApps();
    }

    // =========================================
    // APP RENDERING
    // =========================================
    function renderApps(filter = '') {
      const grid = document.getElementById('app-grid');
      const empty = document.getElementById('empty-state');
      const bookmarks = getBookmarks();
      const query = filter.toLowerCase().trim();

      const filtered = apps.filter(app =>
        app.name.toLowerCase().includes(query) ||
        app.description.toLowerCase().includes(query)
      );

      // Sort: bookmarked first, then alphabetical
      filtered.sort((a, b) => {
        const aBookmarked = bookmarks.includes(a.id);
        const bBookmarked = bookmarks.includes(b.id);
        if (aBookmarked && !bBookmarked) return -1;
        if (!aBookmarked && bBookmarked) return 1;
        return a.name.localeCompare(b.name);
      });

      if (filtered.length === 0 && apps.length > 0) {
        grid.innerHTML = '';
        empty.classList.add('visible');
        return;
      }

      empty.classList.remove('visible');

      grid.innerHTML = filtered.map((app, i) => {
        const isBookmarked = bookmarks.includes(app.id);
        return `
          <a href="${app.url}" class="app-card" style="--index: ${i}" title="${app.name}">
            <div class="app-card-header">
              <div class="app-icon">${app.icon}</div>
              <button
                class="bookmark-btn ${isBookmarked ? 'active' : ''}"
                onclick="toggleBookmark('${app.id}', event)"
                aria-label="${isBookmarked ? 'Remove bookmark' : 'Bookmark'}"
              >
                ${isBookmarked ? 'â˜…' : 'â˜†'}
              </button>
            </div>
            <div class="app-name">${app.name}</div>
            <div class="app-description">${app.description}</div>
          </a>
        `;
      }).join('');

      // Show placeholder if no apps registered yet
      if (apps.length === 0) {
        grid.innerHTML = `
          <div class="app-card" style="--index: 0; cursor: default; opacity: 0.5;">
            <div class="app-card-header">
              <div class="app-icon">ðŸš§</div>
            </div>
            <div class="app-name">Coming Soon</div>
            <div class="app-description">Apps are on their way. Check back soon.</div>
          </div>
        `;
      }
    }

    function filterApps() {
      const query = document.getElementById('search-input').value;
      renderApps(query);
    }

    // =========================================
    // FEEDBACK MODAL
    // =========================================
    let feedbackRating = 0;

    function openFeedbackModal() {
      document.getElementById('feedback-modal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeFeedbackModal() {
      document.getElementById('feedback-modal').classList.remove('active');
      document.body.style.overflow = '';
      resetFeedbackForm();
    }

    function setRating(rating) {
      feedbackRating = rating;
      const stars = document.querySelectorAll('#star-rating button');
      stars.forEach((star, i) => {
        star.classList.toggle('active', i < rating);
      });
    }

    function toggleEmailField() {
      const anonymous = document.getElementById('anonymous-toggle').checked;
      const emailField = document.getElementById('email-field');
      emailField.classList.toggle('hidden', anonymous);
      emailField.classList.toggle('visible', !anonymous);
    }

    function resetFeedbackForm() {
      feedbackRating = 0;
      document.querySelectorAll('#star-rating button').forEach(s => s.classList.remove('active'));
      document.getElementById('feedback-category').value = '';
      document.getElementById('feedback-text').value = '';
      document.getElementById('feedback-email').value = '';
      document.getElementById('anonymous-toggle').checked = true;
      document.getElementById('email-field').classList.add('hidden');
      document.getElementById('email-field').classList.remove('visible');
    }

    function submitFeedback() {
      const category = document.getElementById('feedback-category').value;
      const text = document.getElementById('feedback-text').value.trim();
      const anonymous = document.getElementById('anonymous-toggle').checked;
      const email = anonymous ? null : document.getElementById('feedback-email').value.trim();

      if (!text) {
        alert('Please enter your feedback.');
        return;
      }

      const feedback = {
        rating: feedbackRating,
        category,
        text,
        anonymous,
        email,
        timestamp: new Date().toISOString()
      };

      // TODO: Send to backend
      // fetch('/api/feedback', {
      //   method: 'POST',
      //   headers: { 'Content-Type': 'application/json' },
      //   body: JSON.stringify(feedback)
      // });

      console.log('Feedback submitted:', feedback);
      closeFeedbackModal();
      alert('Thank you for your feedback!');
    }

    // Close modal on overlay click
    document.getElementById('feedback-modal').addEventListener('click', function(e) {
      if (e.target === this) closeFeedbackModal();
    });

    // Close modal on Escape
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeFeedbackModal();
    });

    // =========================================
    // INIT
    // =========================================
    initTheme();
    renderApps();
  </script>
</body>
</html>
