<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[APP NAME] — Good Free Apps</title>
  <meta name="description" content="[APP DESCRIPTION]">

  <!-- Shared Design System -->
  <link rel="stylesheet" href="../../shared/design-tokens.css">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       APP HEADER (consistent across all apps)
       ========================================= */
    .app-header {
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--color-background);
      position: sticky;
      top: 1rem;
      margin: 1rem 2rem 0;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      z-index: 100;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-sm);
    }

    .app-header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      background: var(--color-accent);
      color: #ffffff;
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-base);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* =========================================
       APP CONTENT AREA
       ========================================= */
    .app-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 2rem 4rem;
    }

    .app-title-section {
      margin-bottom: 2rem;
    }

    .app-title {
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-bold);
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .app-description {
      color: var(--color-text-secondary);
      font-size: var(--font-size-md);
    }

    /* =========================================
       APP-SPECIFIC STYLES
       Add your custom styles below this line.
       Use design tokens for consistency:
         var(--color-accent)
         var(--color-surface)
         var(--spacing-md)
         var(--radius-md)
         etc.
       ========================================= */


  </style>
</head>
<body>

  <!-- App Header (consistent across all apps) -->
  <header class="app-header">
    <div class="app-header-left">
      <a href="../../index.html" class="logo" title="Back to hub">
        <div class="logo-mark">G</div>
        <span>Good Free Apps</span>
      </a>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="window.location.href='../../index.html'" title="Back to all apps">
        ←
      </button>
      <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme">
        <span id="theme-icon">◐</span>
      </button>
    </div>
  </header>

  <!-- App Content -->
  <main class="app-container">
    <div class="app-title-section">
      <h1 class="app-title">[APP NAME]</h1>
      <p class="app-description">[APP DESCRIPTION]</p>
    </div>

    <!-- ====================================
         YOUR APP UI GOES HERE
         Use design token classes and variables
         for consistency with the hub.
         ==================================== -->
    <div id="app-content">

    </div>
  </main>

  <!-- Shared Analytics -->
  <!-- <script src="../../shared/analytics.js"></script> -->

  <script>
    // =========================================
    // APP CONFIGURATION
    // Update this for each app.
    // =========================================
    const APP_NAME = '[app-id]';  // e.g. 'calculator', 'pdf-tools'

    // =========================================
    // THEME (required — same in every app)
    // =========================================
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }

    function initTheme() {
      const saved = localStorage.getItem('theme');
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (systemDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    }

    // =========================================
    // ANALYTICS HOOKS (uncomment when ready)
    // =========================================
    // if (typeof trackPageView === 'function') {
    //   trackPageView(APP_NAME);
    //   trackSessionStart(APP_NAME);
    //   setupErrorTracking(APP_NAME);
    // }
    //
    // To track custom events in your app:
    // trackEvent('action_name', APP_NAME, { optional: 'metadata' });

    // =========================================
    // YOUR APP CODE GOES BELOW
    // =========================================


    // =========================================
    // INIT
    // =========================================
    initTheme();
  </script>
</body>
</html>
